<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Canvas -->
    <rect id="bg" width="512" height="512" fill="#0A0C10" />

    <!-- Electric Gradient transitioning from Bright Blue to Soft Purple -->
    <linearGradient id="pulseGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
  </defs>

  <!-- Canvas Fill -->
  <use href="#bg" />

  <!-- App Icon Card Frame -->
  <rect x="48" y="48" width="416" height="416" rx="96" fill="#11151C" stroke="#1E2633" stroke-width="4" />

  <!-- Precise Vector Path matching the icon reference -->
  <path d="M 120 256 
           L 208 256 
           L 248 132 
           L 296 380 
           L 344 256 
           L 392 256" 
        fill="none" 
        stroke="url(#pulseGradient)" 
        stroke-width="20" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
</svg>
